name: 全天候市場行情更新
run-name: Market refresh ${{ github.event.schedule == '07,37 * * * *' && 'primary' || github.event.schedule == '22,52 * * * *' && 'watchdog' || github.event_name }}
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-global.yml
      - scripts/update_global.py
  schedule:
    - cron: '07,37 * * * *'
    - cron: '22,52 * * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: market-refresh-main
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check missing or failed primary run
        id: guard
        if: github.event.schedule == '22,52 * * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          window=$(date --utc --date='25 hours ago' +%FT%TZ)
          if gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/update-global.yml/runs" -f event=schedule -f created=">=$window" -F per_page=100 > "$RUNNER_TEMP/scheduled-runs.json"; then
            python scripts/market_schedule_audit.py "$RUNNER_TEMP/scheduled-runs.json" "$RUNNER_TEMP/market-schedule-audit.json" || echo "Schedule audit unavailable. Continuing with a source retry." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GitHub run records couldn't be read. Continuing with a source retry." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify and commit latest available market data
        if: steps.guard.outputs.skip != 'true'
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MARKET_REPORT: ${{ runner.temp }}/market-report.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            result=0
            python scripts/update_global.py || result=$?
            git add -A data
            if git diff --cached --quiet; then exit "$result"; fi
            git commit -m 'Update verified market quotes'
            if git push origin HEAD:main; then exit "$result"; fi
            sleep 4
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always() && steps.guard.outputs.skip != 'true'
        with:
          name: market-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/market-report.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always() && github.event.schedule == '22,52 * * * *'
        with:
          name: market-schedule-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/market-schedule-audit.json
          if-no-files-found: warn
          retention-days: 30
