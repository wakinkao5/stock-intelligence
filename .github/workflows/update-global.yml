name: 更新國際市場每日收盤資料
on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * 1-6' # 08:30 Asia/Taipei, Mon-Sat
    - cron: '30 8 * * 1-5' # 16:30 Asia/Taipei, Mon-Fri
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch delayed international closes
        run: python scripts/update_global.py
      - name: Commit verified quotes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/global.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified delayed global closes'
            git push
          fi
