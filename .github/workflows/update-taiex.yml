name: 更新台股 FinMind 收盤資料
on:
  workflow_dispatch:
  schedule:
    - cron: '45 8 * * 1-5' # 16:45 Asia/Taipei
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backfill Q4 and update TAIEX
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/update_twse.py
      - name: Commit verified market history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/taiex.json
          if ! git diff --cached --quiet; then
            git commit -m 'Backfill Q4 2026 verified TAIEX closes'
            git push
          fi
