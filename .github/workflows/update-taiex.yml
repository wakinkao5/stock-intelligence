name: 更新台股官方收盤資料
on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC; 08:45 UTC = 16:45 Taiwan time
    - cron: '45 8 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch TWSE official data
        run: python scripts/update_twse.py
      - name: Commit updated market history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/taiex.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official TWSE daily close history'
            git push
          fi
