name: 台股盤前鎖定與正式收盤驗證
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/market_cycle.py
      - .github/workflows/update-taiex.yml
  schedule:
    - cron: '40 0 * * 1-5' # 08:40 Asia/Taipei
    - cron: '42 0 * * 1-5' # retry before cutoff
    - cron: '30,37,52 5 * * 1-5'
    - cron: '07,37 6,7 * * 1-5'
    - cron: '45 8 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Run scheduled market cycle
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            '40 0 '*|'42 0 '*) mode=morning ;;
            *) mode=close ;;
          esac
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/market_cycle.py "$mode" || exit 1
            git add data/taiex.json data/predictions.json data/verification.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record TWSE market cycle ($mode)"
            if git push origin HEAD:main; then exit 0; fi
            if [ "$mode" = morning ]; then
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              exit 1
            fi
            sleep 5
          done
          exit 1
