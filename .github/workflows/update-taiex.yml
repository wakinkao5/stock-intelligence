name: 每日更新證交所台股收盤資料
on:
  workflow_dispatch:
  schedule:
    - cron: '45 8 * * 1-5' # 16:45 Asia/Taipei
permissions:
  contents: write
concurrency:
  group: daily-twse-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official TWSE daily history and turnover
        run: python scripts/update_twse.py
      - name: Commit updated market data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/taiex.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official TWSE daily market data'
            git push
          fi
